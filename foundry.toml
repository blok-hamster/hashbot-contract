[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_estimate_multiplier = 200
evm_version = "cancun"
verbosity = 2

ffi = true
fs_permissions = [
  { access = "read", path = "./images" },
  { access = "read-write", path = "./script" },
  { access = "read-write", path = "../ui/src/lib" },
  { access = "read-write", path = "./" }
]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
anvil = "http://127.0.0.1:8545"